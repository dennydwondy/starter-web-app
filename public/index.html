<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Starter Web App</title>
    <style>
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; padding: 2rem; }
      .card { border: 1px solid #e5e7eb; padding: 1.5rem; border-radius: 8px; max-width: 720px; }
      button { padding: 0.5rem 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Starter Web App</h1>
    <div class="card">
      <p>This is a minimal Express starter that serves a static page and a small API.</p>
      <p>
        <button id="btn">Call /api/hello</button>
      </p>
      <pre id="out"></pre>
    </div>

    <script>
      document.getElementById('btn').addEventListener('click', async () => {
        const out = document.getElementById('out');
        out.textContent = 'Loading...';
        try {
          const res = await fetch('/api/hello');
          const json = await res.json();
          out.textContent = JSON.stringify(json, null, 2);
        } catch (err) {
          out.textContent = String(err);
        }
      });
    </script>
  </body>
</html>
